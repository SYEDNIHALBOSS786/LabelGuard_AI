<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabelGuard AI</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">
    <style>
        body { background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .upload-box { border: 2px dashed #38bdf8; border-radius: 10px; padding: 25px; text-align: center; cursor: pointer; }
        .upload-box:hover { background: rgba(56, 189, 248, 0.05); }
        pre { background: #020617; color: #38bdf8; padding: 14px; border-radius: 8px; white-space: pre-wrap; font-size: 0.9rem; max-height: 300px; }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 700px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-info">🛡️ LabelGuard AI</h2>
            <p class="text-secondary">Instant Legal Metrology & FSSAI Compliance Checker</p>
        </div>

        <div class="card p-4 shadow-lg mb-4">
            <div class="upload-box" onclick="document.getElementById('labelImg').click()">
                <input type="file" id="labelImg" accept="image/*" class="d-none" onchange="showPreview(this)">
                <h6 class="mb-1 text-light">📸 Click to Upload Product Label</h6>
                <small class="text-secondary">Supports JPG, PNG, WEBP</small>
                <img id="preview" class="img-fluid rounded mt-3 d-none" style="max-height: 200px;">
            </div>

            <button id="scanBtn" class="btn btn-primary w-100 mt-3 py-2 fw-bold" onclick="startScan()">
                🔍 Check Compliance
            </button>
            <div id="loader" class="text-center mt-3 d-none text-warning">🤖 Scanning Label via Multimodal AI...</div>
            <div id="errorMsg" class="alert alert-danger mt-3 d-none small"></div>
        </div>

        <!-- Output Results -->
        <div id="resultBox" class="d-none">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 id="statusHeader" class="fw-bold mb-0"></h5>
                    <span class="badge bg-info fs-6" id="scoreBadge"></span>
                </div>

                <h6 class="text-secondary fw-semibold mt-2">Detected Label Text:</h6>
                <pre id="textOutput"></pre>
            </div>
        </div>
    </div>

    <script>
        function showPreview(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function startScan() {
            const fileInput = document.getElementById('labelImg');
            const errorMsg = document.getElementById('errorMsg');
            const loader = document.getElementById('loader');
            const scanBtn = document.getElementById('scanBtn');
            const resultBox = document.getElementById('resultBox');

            if(!fileInput.files[0]) {
                alert("Please select an image first!");
                return;
            }

            errorMsg.classList.add('d-none');
            resultBox.classList.add('d-none');
            loader.classList.remove('d-none');
            scanBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('/ocr', { method: 'POST', body: formData });
                const data = await res.json();

                if(!data.success) {
                    errorMsg.innerText = data.message || "Could not read label.";
                    errorMsg.classList.remove('d-none');
                    return;
                }

                document.getElementById('textOutput').innerText = data.text || "No text detected.";
                document.getElementById('scoreBadge').innerText = `${data.detected_count} / ${data.total_checks} Passed`;
                document.getElementById('statusHeader').innerHTML = data.status === 'COMPLIANT' 
                    ? `<span class="text-success">✅ COMPLIANT</span>` 
                    : `<span class="text-warning">⚠️ POTENTIAL NON-COMPLIANCE</span>`;

                resultBox.classList.remove('d-none');
            } catch(e) {
                errorMsg.innerText = "Error connecting to server: " + e.message;
                errorMsg.classList.remove('d-none');
            } finally {
                loader.classList.add('d-none');
                scanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
