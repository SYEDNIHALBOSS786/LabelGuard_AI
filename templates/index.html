<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabelGuard AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #050811; color: #f8fafc; font-family: system-ui, sans-serif; min-height: 100vh; }
        .glass-card { background: #0d1322; border: 1px solid #1f293d; border-radius: 16px; }
        .nav-link { color: #94a3b8; border-radius: 8px; font-weight: 600; }
        .nav-link.active { background: linear-gradient(135deg, #2563eb, #06b6d4) !important; color: #fff !important; }
        .upload-dropzone { border: 2px dashed #06b6d4; border-radius: 14px; padding: 25px; text-align: center; cursor: pointer; position: relative; }
        .scanner-active .laser-line { display: block !important; position: absolute; left: 0; right: 0; height: 3px; background: #00f0ff; box-shadow: 0 0 15px #00f0ff; animation: scan 2s infinite alternate; }
        @keyframes scan { 0% { top: 5%; } 100% { top: 90%; } }
        .btn-launch { background: linear-gradient(135deg, #2563eb, #06b6d4); border: none; color: #fff; font-weight: 700; padding: 12px; border-radius: 10px; }
        .pill-pass { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .pill-fail { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid rgba(244,63,94,0.4); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        pre { background: #030712; color: #38bdf8; border: 1px solid #1f293d; border-radius: 10px; padding: 12px; font-size: 0.85rem; max-height: 200px; }
    </style>
</head>
<body class="p-3">
    <div class="container" style="max-width: 850px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0 text-info"><i class="fa-solid fa-shield-halved me-2"></i>LabelGuard AI</h4>
            <span class="badge bg-success">Online</span>
        </div>

        <div class="glass-card p-4 mb-4">
            <ul class="nav nav-pills justify-content-center mb-3">
                <li class="nav-item"><button class="nav-link active" id="img-tab" data-bs-toggle="pill" data-bs-target="#img-pane">Scan / Photo</button></li>
                <li class="nav-item"><button class="nav-link" id="txt-tab" data-bs-toggle="pill" data-bs-target="#txt-pane">Paste Text</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="img-pane">
                    <div class="upload-dropzone" id="dropArea" onclick="document.getElementById('labelInput').click()">
                        <div class="laser-line d-none" id="laserBeam"></div>
                        <input type="file" id="labelInput" accept="image/*" class="d-none" onchange="handleImage(this)">
                        <div id="uploadPrompt"><i class="fa-solid fa-cloud-arrow-up fs-2 text-info mb-2"></i><br>Upload Label Image / Photo</div>
                        <div id="previewContainer" class="d-none"><img id="imagePreview" class="img-fluid rounded" style="max-height: 200px;" /></div>
                    </div>
                </div>
                <div class="tab-pane fade" id="txt-pane">
                    <textarea id="rawTextInput" class="form-control bg-dark text-light border-secondary" rows="5" placeholder="Paste label text here..."></textarea>
                </div>
            </div>

            <button id="scanBtn" class="btn btn-launch w-100 mt-3" onclick="startAudit()"><i class="fa-solid fa-bolt me-1"></i> Audit Compliance & Health</button>
            <div id="loader" class="text-center py-3 d-none text-info"><div class="spinner-border spinner-border-sm me-2"></div>Auditing parameters...</div>
            <div id="errorAlert" class="alert alert-danger mt-3 d-none py-2 small"></div>
        </div>

        <div id="resultsCard" class="glass-card p-4 d-none">
            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                <div><span class="text-secondary small">VERDICT</span><h4 id="verdictHeading" class="m-0 fw-bold">--</h4></div>
                <div class="text-end"><span class="fs-4 fw-bold text-info" id="scoreValue">6/6</span><br><span class="text-secondary small">Rules Verified</span></div>
            </div>

            <h6 class="text-warning fw-bold mb-2"><i class="fa-solid fa-heart-pulse me-1"></i> Health & Chemical Warnings</h6>
            <div class="row g-2 mb-3 small">
                <div class="col-6 p-2 bg-dark rounded"><strong>Allergens:</strong> <span id="allergensBox" class="text-light">--</span></div>
                <div class="col-6 p-2 bg-dark rounded"><strong>Preservatives:</strong> <span id="preservativesBox" class="text-light">--</span></div>
                <div class="col-6 p-2 bg-dark rounded"><strong>Sugar:</strong> <span id="sugarBox" class="text-light">--</span></div>
                <div class="col-6 p-2 bg-dark rounded"><strong>Sodium:</strong> <span id="sodiumBox" class="text-light">--</span></div>
            </div>

            <h6 class="text-info fw-bold mb-2"><i class="fa-solid fa-list-check me-1"></i> Legal Metrology Declarations</h6>
            <div class="table-responsive mb-3">
                <table class="table table-dark table-hover mb-0 small">
                    <thead><tr class="text-secondary"><th>Rule</th><th>Status</th><th>Found</th><th>Guideline</th></tr></thead>
                    <tbody id="auditTableBody"></tbody>
                </table>
            </div>

            <h6 class="text-secondary small fw-bold">Raw OCR Stream</h6>
            <pre id="rawTextDisplay" class="mb-0"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let mode = 'img';
        document.getElementById('img-tab').onclick = () => mode = 'img';
        document.getElementById('txt-tab').onclick = () => mode = 'txt';

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('d-none');
                    document.getElementById('uploadPrompt').classList.add('d-none');
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        async function startAudit() {
            const formData = new FormData();
            if (mode === 'img') {
                const f = document.getElementById('labelInput').files[0];
                if (!f) return alert("Select image first!");
                formData.append('image', f);
                document.getElementById('dropArea').classList.add('scanner-active');
                document.getElementById('laserBeam').classList.remove('d-none');
            } else {
                const t = document.getElementById('rawTextInput').value.trim();
                if (!t) return alert("Enter label text first!");
                formData.append('text_input', t);
            }

            document.getElementById('errorAlert').classList.add('d-none');
            document.getElementById('resultsCard').classList.add('d-none');
            document.getElementById('loader').classList.remove('d-none');
            document.getElementById('scanBtn').disabled = true;

            try {
                const res = await fetch('/ocr', { method: 'POST', body: formData });
                const data = JSON.parse(await res.text());
                if (!data.success) throw new Error(data.message);

                document.getElementById('verdictHeading').innerHTML = data.status === 'COMPLIANT' 
                    ? `<span class="text-success"><i class="fa-solid fa-check-circle me-1"></i> COMPLIANT</span>`
                    : `<span class="text-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i> NON-COMPLIANT</span>`;

                document.getElementById('scoreValue').innerText = `${data.detected_count}/${data.total_checks}`;
                document.getElementById('rawTextDisplay').innerText = data.text;

                const hs = data.health_safety || {};
                document.getElementById('allergensBox').innerText = (hs.allergens || []).join(', ') || 'None Flagged';
                document.getElementById('preservativesBox').innerText = (hs.preservatives || []).join(', ') || 'None Detected';
                document.getElementById('sugarBox').innerText = hs.sugar_level || 'MODERATE';
                document.getElementById('sodiumBox').innerText = hs.sodium_level || 'MODERATE';

                const tbody = document.getElementById('auditTableBody');
                tbody.innerHTML = "";
                (data.checks || []).forEach(item => {
                    const pass = String(item.status).toUpperCase() === 'PASS';
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.field}</td>
                            <td><span class="${pass ? 'pill-pass' : 'pill-fail'}">${pass ? 'PASS' : 'FAIL'}</span></td>
                            <td class="${pass ? 'text-light' : 'text-danger'}">${item.found_value || 'Not Detected'}</td>
                            <td class="text-secondary">${item.feedback || '-'}</td>
                        </tr>
                    `;
                });

                document.getElementById('resultsCard').classList.remove('d-none');
            } catch (err) {
                document.getElementById('errorAlert').innerText = err.message;
                document.getElementById('errorAlert').classList.remove('d-none');
            } finally {
                document.getElementById('loader').classList.add('d-none');
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('dropArea').classList.remove('scanner-active');
                document.getElementById('laserBeam').classList.add('d-none');
            }
        }
    </script>
</body>
</html>
